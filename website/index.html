
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CW-Net Autonomous Driving Simulation</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

  <div id="hud">
    <h2>CW-Net Simulation</h2>

    <div class="info">
      <span class="label">Simulation Time</span>
      <span id="time">0.0 s</span>
    </div>

    <div class="info">
      <span class="label">Vehicle Speed</span>
      <span id="speed">0 km/h</span>
    </div>

    <div class="info">
      <span class="label">Selected Path</span>
      <span id="selected">-</span>
    </div>

    <div class="info">
      <span class="label">Status</span>
      <span id="status">Simulation Ready</span>
    </div>

    <hr>

    <div class="control-section">
      <h3>Simulation Control</h3>
      <div class="controls">
        <button id="playBtn">재생</button>
        <button id="pauseBtn">일시정지</button>
        <button id="resetBtn">처음부터</button>
      </div>
    </div>

    <hr>

    <div class="control-section">
      <h3>Camera View</h3>
      <div class="controls">
        <button id="followBtn">추적 시점</button>
        <button id="topBtn">탑뷰</button>
        <button id="driverBtn">운전자 시점</button>
      </div>
    </div>

    <hr>

    <div class="legend">
      <div>
        <span class="color-box green"></span>
        Selected Trajectory
      </div>
      <div>
        <span class="color-box orange"></span>
        Alternative Trajectory
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>

</body>
</html>
